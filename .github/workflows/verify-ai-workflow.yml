name: Verify AI workflow

on:
  push:
    paths:
      - "ai-workflow/**"
      - ".github/workflows/verify-ai-workflow.yml"
  workflow_dispatch:

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r ai-workflow/requirements.txt
      - name: Run deterministic workflow test
        run: python ai-workflow/tests/test_workflow.py
